services:
  voice-server:
    build: .
    image: tfrs-voice-server:local
    restart: unless-stopped
    ports:
      - "${TFRS_PORT:-9987}:${TFRS_PORT:-9987}/udp"
    environment:
      TFRS_PORT: "${TFRS_PORT:-9987}"
      TFRS_PASSWORD: "${TFRS_PASSWORD:-changeme}"
      TFRS_MAX_CLIENTS: "${TFRS_MAX_CLIENTS:-300}"
      TFRS_TIMEOUT_SECONDS: "${TFRS_TIMEOUT_SECONDS:-20}"
