name = "Task Force Radio Standalone"
prefix = "tfar"
mainprefix = "z"

[version]
major = 1
minor = 0
patch = 0
git_hash = 8

[hemtt.build]
# One BI include (Zeus's RscDisplayAttributes.sqf) needs the P-Drive to resolve. Without this,
# HEMTT's P-Drive include lookup isn't fully enabled even when P:\a3\ exists locally — see
# addon/README.md "Known HEMTT build findings".
pdrive = "require"

[hemtt.check]
pdrive = "ignore"

[lints.sqf]
# format ["some string with no %1", extraArg] is harmless at runtime (SQF's format ignores unused
# args) — downgraded to a warning rather than fixed, since the 4 flagged call sites look like they
# may have intended to interpolate the extra arg (e.g. into a per-channel-unique ACE action ID or a
# localized hint), which would be a content/behavior fix outside this pass's scope. See
# addon/README.md "Known HEMTT build findings".
format_args = "Warning"

[files]
include = [
    "LICENSE.md",
    "CONTRIBUTORS.md",
    "manw_winner_addon_1st_emblem.paa",
    "task_force_arrowhead_logo.paa",
    "task_force_radio_pipe.dll",
    "task_force_radio_pipe_x64.dll",
]
