name: voice-server

on:
  push:
    branches: [main]
    paths:
      - "voice-server/**"
      - ".github/workflows/voice-server.yml"
  pull_request:
    paths:
      - "voice-server/**"
      - ".github/workflows/voice-server.yml"
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voice-server/src/Tfrs.VoiceServer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet build -c Release

  docker:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute lowercase image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: voice-server
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.image.outputs.name }}-voice-server:latest,${{ steps.image.outputs.name }}-voice-server:${{ github.sha }}
