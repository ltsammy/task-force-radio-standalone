name: addon

on:
  push:
    branches: [main]
    paths:
      - "addon/extensions/**"
      - ".github/workflows/addon.yml"
  pull_request:
    paths:
      - "addon/extensions/**"
  workflow_dispatch:

# Only builds the extension DLLs. PBO building (hemtt build/release) is NOT done here: it needs a
# P-Drive or a real Arma 3 installation to resolve one BI include (see addon/README.md "Known
# HEMTT build findings"), which GitHub-hosted runners don't have. Build/release/publish all happen
# locally instead — see build-local.ps1 / publish-local.ps1, both of which pull these DLLs from the
# latest successful run of this workflow.
jobs:
  extension:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - arch: x64
            cmake_arch: x64
          - arch: win32
            cmake_arch: Win32
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S addon/extensions/task_force_radio_pipe -B build/${{ matrix.arch }} -A ${{ matrix.cmake_arch }}
      - name: Build
        run: cmake --build build/${{ matrix.arch }} --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: extension-${{ matrix.arch }}
          path: build/${{ matrix.arch }}/Release/*.dll
          if-no-files-found: error
