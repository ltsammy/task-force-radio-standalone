name: voice-client

on:
  push:
    branches: [main]
    paths:
      - "voice-client/**"
      - ".github/workflows/voice-client.yml"
  pull_request:
    paths:
      - "voice-client/**"
      - ".github/workflows/voice-client.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: voice-client/src/Tfrs.VoiceClient
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - run: dotnet build -c Release

      # Single-file, self-contained (settings live in the .csproj) — one .exe, no separate
      # .NET runtime install needed.
      - name: Publish
        run: dotnet publish -c Release -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: TfrsVoiceClient-win-x64
          path: voice-client/src/Tfrs.VoiceClient/publish/
