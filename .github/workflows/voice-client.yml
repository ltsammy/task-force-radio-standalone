name: voice-client

on:
  push:
    branches: [main]
    paths:
      - "voice-client/**"
      - ".github/workflows/voice-client.yml"
  pull_request:
    paths:
      - "voice-client/**"
      - ".github/workflows/voice-client.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: voice-client/src/Tfrs.VoiceClient
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - run: dotnet build -c Release

      # Self-contained (no separate .NET runtime install needed) but NOT single-file: an ordinary
      # folder of DLLs reads as a normal .NET app to AV/SmartScreen, where a self-extracting single
      # exe bundle tends to trip more heuristics — see docs/av-false-positives.md.
      - name: Publish
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: TfrsVoiceClient-win-x64
          path: voice-client/src/Tfrs.VoiceClient/publish/
